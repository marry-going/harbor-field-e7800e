merge_protections_settings:
  reporting_method: check-runs
  post_comment: false

merge_protections:
  - name: policy owner gate
    if:
      - base = main
      - mergify-configuration-changed
    success_conditions:
      - "#approved-reviews-by >= 1"

pull_request_rules:
  - name: docs canary
    conditions:
      - base = main
      - author = testbuyer94-collab
      - label = ready-e7800e
      - files ~= ^docs/
      - -mergify-configuration-changed
    actions:
      merge:
        method: merge
